name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build release
        run: dotnet build TolkIsland.csproj -c Release

      - name: Run regression suite
        run: dotnet run --project tests/TolkIsland.Regression/TolkIsland.Regression.csproj -c Debug
